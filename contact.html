
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | FitZone</title>

    <link href="./src/output.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body class="bg-white text-[#202020]">

    
    <header class="flex items-center justify-between px-6 md:px-16 py-5 border-b border-gray-100 ">

        <h1 class="text-2xl font-extrabold">
            Fit<span class="text-orange-500">Zone.</span>
        </h1>

        
        <nav class="hidden md:flex gap-8 text-sm font-medium">
            <a href="index.html" class="hover:text-orange-500">Home</a>
            
            <a href="package.html" class="hover:text-orange-500">Packages</a>
           
            <a href="contact.html" class="text-orange-500">Contact</a>
        </nav>

        <div class="flex items-center gap-4">

            <a href="package.html"
                class="bg-orange-500 text-white px-5 py-2.5 rounded-full text-sm font-semibold hover:bg-orange-600 ">
                Join Now
            </a>

            <button id="menuBtn" class="md:hidden text-2xl">
                ☰
            </button>

        </div>

        <div id="side-navbar"
            class="fixed top-0 left-0 bg-[#da642a] text-white w-64 h-full z-50 p-6 transition-transform duration-300 -translate-x-full">

            <p class="text-right">
                <i id="side-navbar-close"
                    class="fa-solid fa-xmark cursor-pointer text-xl"></i>
            </p>

            <div class="flex flex-col gap-6 mt-8">
                <a href="index.html">Home</a>
                <a href="package.html">Packages</a>
                <a href="contact.html">Contact</a>
            </div>

        </div>

    </header>


    
    <section class="bg-[#202020] text-white px-6 py-16 md:py-20 text-center">

        <p class="text-orange-500 uppercase tracking-widest text-sm font-bold">
            Get In Touch
        </p>

        <h2 class="text-4xl md:text-5xl font-extrabold mt-4">
            Contact <span class="text-orange-500">Us.</span>
        </h2>

        <p class="text-gray-400 mt-5 max-w-xl mx-auto leading-7">
            Have questions about our gym or membership plans?
            We'd love to hear from you.
        </p>

    </section>


    
    <section class="px-6 md:px-16 py-16">

      

           
           


           
            <div class="bg-gray-50 p-7 md:p-10 rounded-2xl">

                <h2 class="text-2xl font-bold mb-6">
                    Send Us a Message
                </h2>

                <form id="contactForm" class="flex flex-col gap-5">

                    <div>
                        <label class="block font-semibold mb-2">
                            Your Name
                        </label>

                        <input
                            type="text"
                            placeholder="Enter your name"
                            required
                            class="w-full p-3 rounded-lg border border-gray-200 outline-none focus:border-orange-500">
                    </div>

                    <div>
                        <label class="block font-semibold mb-2">
                            Email Address
                        </label>

                        <input
                            type="email"
                            placeholder="Enter your email"
                            required
                            class="w-full p-3 rounded-lg border border-gray-200 outline-none focus:border-orange-500">
                    </div>

                    <div>
                        <label class="block font-semibold mb-2">
                            Subject
                        </label>

                        <input
                            type="text"
                            placeholder="Enter subject"
                            required
                            class="w-full p-3 rounded-lg border border-gray-200 outline-none focus:border-orange-500">
                    </div>

                    <div>
                        <label class="block font-semibold mb-2">
                            Message
                        </label>

                        <textarea
                            rows="5"
                            placeholder="Write your message..."
                            required
                            class="w-full p-3 rounded-lg border border-gray-200 outline-none focus:border-orange-500 resize-none"></textarea>
                    </div>

                    <button
                        type="submit"
                        class="bg-orange-500 text-white py-3 rounded-lg font-semibold hover:bg-orange-600 transition">
                        Send Message
                    </button>

                </form>

            </div>

       

    </section>


    
    <footer class="bg-[#202020] text-white px-6 md:px-16 py-10">

        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between gap-6">

            <div>
                <h2 class="text-2xl font-extrabold">
                    Fit<span class="text-orange-500">Zone.</span>
                </h2>

                <p class="text-gray-400 text-sm mt-3">
                    Train Hard. Stay Strong.
                </p>
            </div>

            <div class="flex gap-6 text-sm text-gray-400 flex-wrap">
                <a href="index.html" class="hover:text-orange-500">Home</a>
              
                <a href="package.html" class="hover:text-orange-500">Packages</a>
                  
                <a href="contact.html" class="hover:text-orange-500">Contact</a>
            </div>

        </div>

        <div class="max-w-7xl mx-auto border-t border-gray-700 mt-8 pt-6 text-center text-gray-500 text-sm">
            ©  FitZone 2026. All rights reserved.
        </div>

    </footer>


    
    <script src="contact.js"> </script>

</body>
</html>
